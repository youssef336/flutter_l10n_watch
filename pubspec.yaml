name: flutter_l10n_watch
description: >-
  Translation health checker for Flutter projects. Finds missing, empty,
  untranslated, unused and undefined keys, placeholder and plural mistakes,
  overflow risks, hardcoded strings and RTL smells for easy_localization
  JSON and gen_l10n ARB setups.
version: 0.1.0
repository: https://github.com/youssef336/flutter_l10n_watch
issue_tracker: https://github.com/youssef336/flutter_l10n_watch/issues
topics:
  - flutter
  - localization
  - l10n
  - i18n
  - cli

environment:
  sdk: ^3.6.0

executables:
  l10n_watch:

dependencies:
  args: ^2.6.0
  glob: ^2.1.2
  path: ^1.9.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0
